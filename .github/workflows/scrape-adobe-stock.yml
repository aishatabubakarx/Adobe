name: Adobe Stock scraper (no Apify)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Contributor, search or asset link(s) (separate multiple with a space or new line)"
        required: true
        type: string
      max_pages:
        description: "Pages to read per contributor/search link (about 100 assets per page)"
        required: false
        default: "3"
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Prepare URL list
        env:
          URLS: ${{ inputs.urls }}   # via env to avoid shell injection
        run: |
          printf '%s\n' "$URLS" | tr -s ' \t' '\n\n' | sed '/^$/d' > urls.txt
          cat urls.txt

      - name: Scrape
        env:
          MAX_PAGES: ${{ inputs.max_pages }}
        run: python adobe_stock_scraper.py --file urls.txt --out adobe_assets.csv --max-pages "$MAX_PAGES"

      - name: Show results in job summary
        if: always()
        run: |
          python - << 'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, os
          if os.path.exists("adobe_assets.csv"):
              rows = list(csv.DictReader(open("adobe_assets.csv", encoding="utf-8")))
              print(f"**{len(rows)} assets**\n")
              print("| Title | Link | Views | Downloads | Creator |")
              print("|---|---|---|---|---|")
              for r in rows[:200]:
                  t = (r["title"] or "").replace("|", "\\|")[:60]
                  print(f"| {t} | {r['link']} | {r['views']} | {r['downloads']} | {r['creator']} |")
              if len(rows) > 200:
                  print("\n_Showing first 200 rows. Download the artifact for all._")
          else:
              print("No results file was produced.")
          PY

      - name: Upload results and debug data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adobe-results
          path: |
            adobe_assets.csv
            debug/
          if-no-files-found: ignore
