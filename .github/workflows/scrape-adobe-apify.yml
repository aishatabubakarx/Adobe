name: Adobe Stock stats (via Apify)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Adobe Stock asset URL(s) (separate multiple with a space or new line)"
        required: true
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare URL list
        env:
          URLS: ${{ inputs.urls }}   # via env to avoid shell injection
        run: |
          printf '%s\n' "$URLS" | tr -s ' \t' '\n\n' | sed '/^$/d' > urls.txt
          cat urls.txt

      - name: Fetch stats
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python apify_adobe.py --file urls.txt --out adobe_assets.csv

      - name: Show results in job summary
        if: always()
        run: |
          python - << 'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, os
          if os.path.exists("adobe_assets.csv"):
              rows = list(csv.DictReader(open("adobe_assets.csv", encoding="utf-8")))
              print("| Title | Link | Views | Downloads | Creator |")
              print("|---|---|---|---|---|")
              for r in rows:
                  t = (r["title"] or "").replace("|", "\\|")[:60]
                  print(f"| {t} | {r['link']} | {r['views']} | {r['downloads']} | {r['creator']} |")
          else:
              print("No results file was produced.")
          PY

      - name: Upload CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adobe-results
          path: adobe_assets.csv
          if-no-files-found: ignore
